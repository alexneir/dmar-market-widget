<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denver Metro Market Conditions</title>
<meta name="description" content="Current Denver metro real estate market conditions from the DMAR Market Trends Report, updated monthly.">
<meta name="robots" content="noindex">
<style>
  :root{
    --surface:#ffffff;
    --card:#f7f7f5;
    --line:#e4e4e0;
    --ink:#14171a;
    --ink-2:#565d66;
    --ink-3:#868d96;
    --accent:#155e9c;
    --accent-soft:rgba(21,94,156,.10);
    --pos:#15803d;
    --neg:#b91c1c;
    --neu:#6b7280;
    --warn-bg:#fdf6e3;
    --warn-ink:#8a6100;
    --warn-line:#e8d9a8;
    --radius:10px;
    --shadow:0 1px 2px rgba(20,23,26,.05), 0 8px 24px -16px rgba(20,23,26,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --surface:#121417; --card:#1a1e23; --line:#2a2f36;
      --ink:#eceff2; --ink-2:#a7afb8; --ink-3:#7a838d;
      --accent:#3b9fd1; --accent-soft:rgba(59,159,209,.14);
      --pos:#4ade80; --neg:#f87171; --neu:#9aa3ad;
      --warn-bg:#241f12; --warn-ink:#e8c977; --warn-line:#4a3f22;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --surface:#121417; --card:#1a1e23; --line:#2a2f36;
    --ink:#eceff2; --ink-2:#a7afb8; --ink-3:#7a838d;
    --accent:#3b9fd1; --accent-soft:rgba(59,159,209,.14);
    --pos:#4ade80; --neg:#f87171; --neu:#9aa3ad;
    --warn-bg:#241f12; --warn-ink:#e8c977; --warn-line:#4a3f22;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--surface);
    color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 18px}

  /* ---------- header ---------- */
  .head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:16px}
  .title{margin:0;font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:26px;line-height:1.15;font-weight:600;letter-spacing:-.01em}
  .sub{margin:5px 0 0;color:var(--ink-2);font-size:13.5px}
  .badge{
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
    border:1px solid var(--line);border-radius:999px;padding:6px 13px;
    background:var(--card);font-size:12.5px;font-weight:600;color:var(--ink-2);
    letter-spacing:.02em;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}

  /* ---------- stat grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .stat{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 15px 13px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;
  }
  .stat-label{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
  .stat-value{font-size:27px;line-height:1.05;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
  .stat-value .unit{font-size:15px;font-weight:500;color:var(--ink-2);margin-left:3px;letter-spacing:0}
  .stat-deltas{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:9px;font-size:12.5px;font-variant-numeric:tabular-nums}
  .delta{display:inline-flex;align-items:baseline;gap:4px;color:var(--ink-3)}
  .delta b{font-weight:650;letter-spacing:-.01em}
  .up b{color:var(--pos)} .down b{color:var(--neg)} .flat b{color:var(--neu)}
  .arrow{font-size:10px;line-height:1}

  /* ---------- lower section ---------- */
  .lower{display:grid;grid-template-columns:1.45fr 1fr;gap:10px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px}
  .panel-title{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:0 0 2px}
  .panel-sub{font-size:12.5px;color:var(--ink-3);margin:0 0 10px}
  .chart{width:100%;height:150px;display:block;overflow:visible;touch-action:pan-y}
  .gridline{stroke:var(--line);stroke-width:1}
  .axis-txt{fill:var(--ink-3);font-size:10.5px;font-variant-numeric:tabular-nums}
  .series-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .series-area{fill:url(#areaGrad)}
  .end-dot{fill:var(--accent);stroke:var(--card);stroke-width:2}
  .cross{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3;opacity:0}
  .hover-dot{fill:var(--accent);stroke:var(--card);stroke-width:2;opacity:0}
  .tip{
    position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-115%);
    background:var(--ink);color:var(--surface);border-radius:6px;padding:5px 9px;
    font-size:12px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;
    transition:opacity .1s ease;z-index:5;
  }
  .chart-host{position:relative}

  .notes{list-style:none;margin:0;padding:0}
  .notes li{position:relative;padding:0 0 0 15px;margin-bottom:9px;font-size:13.5px;line-height:1.45;color:var(--ink-2)}
  .notes li:last-child{margin-bottom:0}
  .notes li:before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--accent)}

  /* ---------- footer ---------- */
  .foot{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;
    margin-top:14px;padding-top:11px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--ink-3);line-height:1.5;
  }
  .foot a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line)}
  .foot a:hover{color:var(--accent);border-bottom-color:var(--accent)}

  .alert{
    display:none;margin-bottom:12px;padding:9px 12px;border-radius:8px;font-size:12.5px;
    background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);
  }
  .alert.show{display:block}

  .skeleton .stat-value,.skeleton .stat-label{color:transparent;background:var(--line);border-radius:4px}

  /* ---------- responsive ---------- */
  @media (max-width:820px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .lower{grid-template-columns:1fr}
    .title{font-size:23px}
  }
  @media (max-width:520px){
    .wrap{padding-block:16px 14px;padding-inline:16px}
    .head{align-items:flex-start}
    .grid{gap:8px}
    .stat{padding:12px 12px 11px;min-height:100px}
    .stat-value{font-size:22px}
    .stat-deltas{gap:3px 10px;font-size:11.5px}
    .title{font-size:20px}
  }
  @media (max-width:400px){
    .stat{padding:11px 10px;min-height:96px}
    .stat-value{font-size:20px}
    .stat-label{font-size:10.5px;letter-spacing:.05em}
    .notes li{font-size:13px}
  }

  @media print{ body{background:#fff} .panel,.stat{break-inside:avoid} }
</style>
</head>
<body>
<div class="wrap">
  <div class="alert" id="alert" role="status"></div>

  <div class="head">
    <div>
      <h1 class="title" id="title">Denver Metro Market Conditions</h1>
      <p class="sub" id="sub">Loading the latest DMAR figures&hellip;</p>
    </div>
    <span class="badge"><span class="dot"></span><span id="badge">&mdash;</span></span>
  </div>

  <div class="grid" id="grid"></div>

  <div class="lower">
    <div class="panel">
      <p class="panel-title">Median Close Price</p>
      <p class="panel-sub" id="chartSub">&nbsp;</p>
      <div class="chart-host">
        <svg class="chart" id="chart" role="img" aria-label="Median close price by month"></svg>
        <div class="tip" id="tip"></div>
      </div>
    </div>
    <div class="panel">
      <p class="panel-title">This Month in the Metro</p>
      <p class="panel-sub" id="notesSub">&nbsp;</p>
      <ul class="notes" id="notes"></ul>
    </div>
  </div>

  <div class="foot">
    <span id="attrib">Source: Denver Metro Association of REALTORS<sup>&reg;</sup> Market Trends Report.</span>
    <span id="stamp"></span>
  </div>
</div>

<script>
(function(){
  "use strict";

  var qs = new URLSearchParams(location.search);

  /* ---- options via query string (all optional) ---- */
  var DATA_URL = qs.get("data") || "data.json";
  var THEME    = qs.get("theme");                 // light | dark | auto
  var ACCENT   = qs.get("accent");                // hex without the #, e.g. accent=8a6d3b
  var BROKER   = qs.get("broker");                // e.g. broker=The%20Neir%20Team
  var HIDETITLE= qs.get("title") === "0";

  if (THEME === "light" || THEME === "dark") document.documentElement.setAttribute("data-theme", THEME);
  if (ACCENT && /^[0-9a-fA-F]{6}$/.test(ACCENT)) document.documentElement.style.setProperty("--accent", "#" + ACCENT);
  if (HIDETITLE) document.querySelector(".head > div").style.display = "none";

  /* ---- last-known snapshot: renders if data.json is ever unreachable ---- */
  var FALLBACK = {
    data_month:"2026-08", data_month_label:"August 2026", last_updated:"2026-09-18",
    market:"Denver Metro", market_note:"11-county Denver metro area",
    source:{name:"Denver Metro Association of REALTORS®", short:"DMAR", report:"Market Trends Report", url:"https://www.dmarealtors.com/market-trends-reports"},
    metrics:[
      {key:"median_close_price",label:"Median Close Price",format:"currency",value:594495,mom:-1.74,yoy:0,polarity:"positive_up"},
      {key:"active_listings",label:"Active Listings",format:"count",value:13080,mom:-0.27,yoy:0.16,polarity:"neutral"},
      {key:"closed_sales",label:"Closed Sales",format:"count",value:null,mom:-18.99,yoy:-17.35,polarity:"positive_up"},
      {key:"days_in_mls",label:"Median Days in MLS",format:"days",value:27,mom:28.57,yoy:-10,polarity:"positive_down"},
      {key:"ytd_median_price",label:"Year to Date Median",format:"currency",value:599990,yoy:0.17,polarity:"positive_up"},
      {key:"ytd_closings",label:"Year to Date Closings",format:"count",value:null,yoy:-3.49,polarity:"positive_up"}
    ],
    notes:[],
    history:[]
  };

  /* ---------- formatting ---------- */
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var SHORT  = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function money(n){ return "$" + Math.round(n).toLocaleString("en-US"); }
  function moneyShort(n){
    if (n >= 1000) return "$" + (n/1000).toFixed(0) + "K";
    return "$" + n;
  }
  function count(n){ return Math.round(n).toLocaleString("en-US"); }
  /* keep DMAR's published precision: 2 decimals, trailing zeros trimmed */
  function pct(n){
    var s = Math.abs(n).toFixed(2);
    if (s.indexOf(".") > -1) s = s.replace(/0+$/, "").replace(/\.$/, "");
    return s + "%";
  }
  function monthLabel(ym){
    var p = String(ym).split("-");
    return MONTHS[parseInt(p[1],10)-1] + " " + p[0];
  }
  function shortLabel(ym){
    var p = String(ym).split("-");
    return SHORT[parseInt(p[1],10)-1];
  }
  function fmtValue(v, format){
    if (v === null || v === undefined) return null;
    if (format === "currency") return { main: money(v), unit: "" };
    if (format === "days")     return { main: count(v), unit: v === 1 ? "day" : "days" };
    if (format === "percent")  return { main: (Math.round(v*100)/100) + "%", unit: "" };
    return { main: count(v), unit: "" };
  }
  function prettyDate(iso){
    if(!iso) return "";
    var p = String(iso).split("-");
    if (p.length < 3) return iso;
    return MONTHS[parseInt(p[1],10)-1] + " " + parseInt(p[2],10) + ", " + p[0];
  }

  /* direction -> css class, respecting what "good" means for that metric */
  function toneFor(change, polarity){
    if (change === null || change === undefined) return "flat";
    if (Math.abs(change) < 0.05) return "flat";
    if (polarity === "neutral") return "flat";
    if (polarity === "positive_down") return change < 0 ? "up" : "down";
    return change > 0 ? "up" : "down";   // positive_up (default)
  }
  function arrowFor(change){
    if (change === null || change === undefined) return "";
    if (Math.abs(change) < 0.05) return "→";
    return change > 0 ? "▲" : "▼";
  }

  /* ---------- rendering ---------- */
  function deltaEl(label, change, polarity, note){
    if (change === null || change === undefined) return "";
    var tone = toneFor(change, polarity);
    var txt  = (Math.abs(change) < 0.05 && note) ? note : (arrowFor(change) + " " + pct(change));
    return '<span class="delta ' + tone + '"><b>' + txt + '</b> ' + label + '</span>';
  }

  function renderStats(d){
    var grid = document.getElementById("grid");
    var prevMonth = "", prevYear = "";
    if (d.data_month){
      var y = parseInt(d.data_month.split("-")[0],10), m = parseInt(d.data_month.split("-")[1],10);
      prevMonth = "vs. " + SHORT[(m+10)%12];
      prevYear  = "vs. " + SHORT[m-1] + " " + (y-1);
    }

    grid.innerHTML = (d.metrics || []).map(function(mt){
      var v = fmtValue(mt.value, mt.format);
      var headline, deltas;

      if (v){
        headline = v.main + (v.unit ? '<span class="unit">' + v.unit + "</span>" : "");
        deltas = deltaEl(prevMonth, mt.mom, mt.polarity, mt.mom_note)
               + deltaEl(prevYear,  mt.yoy, mt.polarity, mt.yoy_note);
      } else if (mt.mom !== null && mt.mom !== undefined){
        /* no absolute figure published: lead with the month-over-month change */
        var tone = toneFor(mt.mom, mt.polarity);
        headline = '<span class="' + tone + '" style="color:var(--' +
                   (tone === "up" ? "pos" : tone === "down" ? "neg" : "neu") + ')">' +
                   arrowFor(mt.mom) + " " + pct(mt.mom) + "</span>";
        deltas = '<span class="delta">' + prevMonth.replace("vs. ","from ") + "</span>"
               + deltaEl(prevYear, mt.yoy, mt.polarity, mt.yoy_note);
      } else if (mt.yoy !== null && mt.yoy !== undefined){
        var t2 = toneFor(mt.yoy, mt.polarity);
        headline = '<span style="color:var(--' +
                   (t2 === "up" ? "pos" : t2 === "down" ? "neg" : "neu") + ')">' +
                   arrowFor(mt.yoy) + " " + pct(mt.yoy) + "</span>";
        deltas = '<span class="delta">year over year</span>';
      } else {
        return "";
      }

      return '<div class="stat">' +
               '<div class="stat-label">' + mt.label + "</div>" +
               '<div>' +
                 '<div class="stat-value">' + headline + "</div>" +
                 '<div class="stat-deltas">' + deltas + "</div>" +
               "</div>" +
             "</div>";
    }).join("");
  }

  function renderNotes(d){
    var notes = (d.notes || []).slice(0,3);
    var ul = document.getElementById("notes");
    document.getElementById("notesSub").textContent = d.data_month_label || "";
    if (!notes.length){
      ul.innerHTML = '<li>Detailed commentary for this month is available in the full DMAR report.</li>';
      return;
    }
    ul.innerHTML = notes.map(function(n){
      return "<li>" + String(n).replace(/[<>]/g, "") + "</li>";
    }).join("");
  }

  /* ---------- chart ---------- */
  var chartData = [];
  var CURRENT = null;

  function renderChart(d){
    var h = (d.history || []).filter(function(r){ return typeof r.median_close_price === "number"; });
    if (h.length > 12) h = h.slice(-12);
    chartData = h;

    var svg = document.getElementById("chart");
    var sub = document.getElementById("chartSub");
    if (h.length < 2){ sub.textContent = "Trend data will appear after two months of readings."; svg.innerHTML = ""; return; }

    sub.textContent = monthLabel(h[0].month) + " – " + monthLabel(h[h.length-1].month);

    var W = svg.clientWidth || 560, H = 150;
    var padL = 44, padR = 14, padT = 12, padB = 22;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);

    var vals = h.map(function(r){ return r.median_close_price; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var span = (hi - lo) || 1;
    lo = lo - span * 0.28; hi = hi + span * 0.28;

    var x = function(i){ return padL + (W - padL - padR) * (h.length === 1 ? 0.5 : i / (h.length - 1)); };
    var y = function(v){ return padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo)); };

    var pts = h.map(function(r,i){ return [x(i), y(r.median_close_price)]; });
    var line = pts.map(function(p,i){ return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
    var area = line + " L" + pts[pts.length-1][0].toFixed(1) + " " + (H-padB) + " L" + pts[0][0].toFixed(1) + " " + (H-padB) + " Z";

    /* recessive gridlines at the true min and max of the data */
    var realLo = Math.min.apply(null, vals), realHi = Math.max.apply(null, vals);
    var g = "";
    [realLo, realHi].forEach(function(v){
      g += '<line class="gridline" x1="' + padL + '" y1="' + y(v).toFixed(1) + '" x2="' + (W-padR) + '" y2="' + y(v).toFixed(1) + '"/>' +
           '<text class="axis-txt" x="' + (padL-7) + '" y="' + (y(v)+3.5).toFixed(1) + '" text-anchor="end">' + moneyShort(v) + "</text>";
    });

    /* x labels: first, last, and a couple in between without crowding */
    var step = h.length > 8 ? 3 : (h.length > 5 ? 2 : 1);
    var xl = "";
    h.forEach(function(r,i){
      var isEdge = (i === 0 || i === h.length-1);
      if (!isEdge && (i % step !== 0 || i > h.length-2)) return;
      var anchor = i === 0 ? "start" : (i === h.length-1 ? "end" : "middle");
      xl += '<text class="axis-txt" x="' + x(i).toFixed(1) + '" y="' + (H-6) + '" text-anchor="' + anchor + '">' + shortLabel(r.month) + "</text>";
    });

    svg.innerHTML =
      '<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="var(--accent)" stop-opacity="0.18"/>' +
        '<stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>' +
      "</linearGradient></defs>" +
      g + xl +
      '<path class="series-area" d="' + area + '"/>' +
      '<path class="series-line" d="' + line + '"/>' +
      '<line class="cross" id="cross" y1="' + padT + '" y2="' + (H-padB) + '"/>' +
      '<circle class="hover-dot" id="hdot" r="4.5"/>' +
      '<circle class="end-dot" cx="' + pts[pts.length-1][0].toFixed(1) + '" cy="' + pts[pts.length-1][1].toFixed(1) + '" r="4.5"/>' +
      '<rect id="hit" x="0" y="0" width="' + W + '" height="' + H + '" fill="transparent"/>';

    wireHover(svg, pts, W);
  }

  function wireHover(svg, pts, W){
    var tip   = document.getElementById("tip");
    var cross = document.getElementById("cross");
    var hdot  = document.getElementById("hdot");
    var host  = svg.parentNode;

    function move(ev){
      var r  = svg.getBoundingClientRect();
      var cx = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) * (W / r.width);
      var best = 0, bd = Infinity;
      pts.forEach(function(p,i){ var d = Math.abs(p[0]-cx); if (d < bd){ bd = d; best = i; } });
      var p = pts[best], rec = chartData[best];
      cross.setAttribute("x1", p[0]); cross.setAttribute("x2", p[0]); cross.style.opacity = ".6";
      hdot.setAttribute("cx", p[0]); hdot.setAttribute("cy", p[1]); hdot.style.opacity = "1";
      tip.innerHTML = monthLabel(rec.month) + " &middot; " + money(rec.median_close_price);
      tip.style.left = (p[0] / W * 100) + "%";
      tip.style.top  = (p[1] / 150 * 100) + "%";
      tip.style.opacity = "1";
    }
    function leave(){ cross.style.opacity = "0"; hdot.style.opacity = "0"; tip.style.opacity = "0"; }

    host.addEventListener("mousemove", move);
    host.addEventListener("mouseleave", leave);
    host.addEventListener("touchstart", move, {passive:true});
    host.addEventListener("touchmove", move, {passive:true});
    host.addEventListener("touchend", leave);
  }

  /* ---------- freshness ---------- */
  function checkFreshness(d){
    if (!d.data_month) return;
    var p = d.data_month.split("-");
    /* DMAR publishes month N around the 4th of month N+1; allow a generous window */
    var due = new Date(Date.UTC(+p[0], +p[1] + 1, 12));   // ~6 weeks after the data month ends
    if (new Date() > due){
      var a = document.getElementById("alert");
      a.textContent = "Showing " + (d.data_month_label || d.data_month) +
        " data. A newer DMAR report may now be available.";
      a.className = "alert show";
    }
  }

  /* ---------- paint ---------- */
  function paint(d, cached){
    CURRENT = d;
    var market = d.market || "Denver Metro";
    document.getElementById("title").textContent = market + " Market Conditions";
    document.getElementById("sub").textContent =
      (d.market_note || "") + (d.market_note ? " · " : "") +
      (d.source && d.source.short ? d.source.short + " " + (d.source.report || "") : "");
    document.getElementById("badge").textContent = (d.data_month_label || "") + " data";

    renderStats(d);
    renderNotes(d);
    renderChart(d);
    checkFreshness(d);

    var src = d.source || {};
    var link = src.month_url || src.url || "https://www.dmarealtors.com/market-trends-reports";
    document.getElementById("attrib").innerHTML =
      "Source: <a href=\"" + link + "\" target=\"_blank\" rel=\"noopener noreferrer\">" +
      (src.name || "Denver Metro Association of REALTORS®") + " " + (src.report || "Market Trends Report") + "</a>." +
      (BROKER ? " Presented by " + String(BROKER).replace(/[<>]/g,"") + "." : "");

    document.getElementById("stamp").textContent =
      (cached ? "Cached figures · " : "") + "Updated " + prettyDate(d.last_updated || d.published);

    postHeight();
  }

  /* let a parent page auto-size the iframe, if it ever listens */
  function postHeight(){
    try{
      var h = document.documentElement.scrollHeight;
      if (window.parent !== window) window.parent.postMessage({ dmarWidgetHeight: h }, "*");
    }catch(e){}
  }

  /* ---------- load ---------- */
  fetch(DATA_URL, { cache: "no-cache" })
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ paint(d, false); })
    .catch(function(){ paint(FALLBACK, true); });

  var t;
  window.addEventListener("resize", function(){
    clearTimeout(t);
    t = setTimeout(function(){
      if (CURRENT) renderChart(CURRENT);
      postHeight();
    }, 150);
  });
  window.addEventListener("load", postHeight);
})();
</script>
</body>
</html>
